name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch/PR are cancelled automatically.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Distribution gate: every pi-*/ directory is listed in the root pi manifest.
      - run: node scripts/check-manifest.mjs
      - run: npm ci
      # Type-check any workspace that defines a `typecheck` script.
      - run: npm run typecheck --workspaces --if-present
      # Run every workspace's test suite (vitest).
      - run: npm test
